# ats_companies.yaml: companies whose jobs are read from the free public job feeds of Greenhouse, Lever and
# Ashby (run.py --ats, the dashboard's Company boards tab). These finds are listed for you to apply to.
# The list below is a working default (UK tech, fintech and AI companies): change these to suit you.
# Each company needs "ats" (greenhouse, lever or ashby) and "slug" (the name in its job board URL, e.g.
# boards.greenhouse.io/<slug>). Companies marked "not on Greenhouse/Lever/Ashby" are skipped.
# Only UK roles are kept.

settings:
  first_run_days: 7      # first run: jobs posted in the last 7 days
  daily_days: 1          # after that: jobs posted in the last day
  auto_apply: true       # apply when the form only asks things covered by answers.yaml; otherwise list for manual apply

